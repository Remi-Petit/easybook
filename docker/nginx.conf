# nginx de l'image unique easybook : un seul port d'entrée (8080).
#
#   /_app/immutable/…  fichiers compilés et hachés du frontend — servis
#                      directement par nginx, avec un cache d'un an ;
#   /api/…             → API Rust (127.0.0.1:8091) ;
#   /ws                → même API, avec la bascule WebSocket ;
#   le reste           → serveur SvelteKit (127.0.0.1:3100), qui rend le HTML.
#
# Tout tourne dans **le même conteneur** : les `proxy_pass` visent la boucle
# locale, jamais l'extérieur. Seul nginx est joignable depuis l'hôte.

# PID 1 reste le script d'entrée : nginx est un enfant comme les autres.
pid /tmp/easybook-nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    # Le mime.types de Debian ignore `.mjs` : servi en octet-stream, le worker de
    # pdf.js (un module) est refusé par le navigateur.
    types {
        application/javascript mjs;
    }
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Les chemins temporaires sont déplacés hors de /var/lib/nginx : le conteneur
    # tourne sous l'utilisateur `node` (uid 1000), pas root.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Une intégrale PDF peut peser plus d'un gigaoctet : le corps des requêtes
    # n'est pas limité (le dépôt est écrit en flux par l'API, en plus).
    client_max_body_size 0;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # `Upgrade` n'est recopié que si le client le demande : sans ce `map`, une
    # connexion WebSocket resterait bloquée sur l'en-tête `Connection`.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Planches et couvertures : le corps ne dépend que de l'URL, qui porte la date
    # du fichier (`v`). Servies par nginx dès la deuxième demande, sans réveiller
    # l'API. Une requête sans `v` (URL non versionnée) n'est jamais mise en cache :
    # un livre remplacé y serait servi périmé.
    proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=media:10m
                     max_size=64m inactive=7d use_temp_path=off;
    map $arg_v $media_uncacheable {
        default 0;
        ''      1;
    }

    server {
        listen 8080;
        server_name _;

        # Fichiers compilés : leur nom contient déjà leur empreinte, ils ne
        # changent donc jamais sous la même URL.
        location /_app/immutable/ {
            root /app/build/client;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Sous-requête de `auth_request` : l'API répond 204 si le cookie de session
        # est valide, 401 sinon. Interne : jamais joignable de l'extérieur.
        location = /_session {
            internal;
            proxy_pass http://127.0.0.1:8091/api/auth/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
        }

        # Planches et couvertures (voir `proxy_cache_path` plus haut). Un `location`
        # à expression régulière passe avant `/api/` ci-dessous.
        location ~ ^/api/(page|cover)$ {
            # Sans ce contrôle, une planche déjà en cache serait servie à
            # n'importe qui : la réponse du cache ne repasse pas par l'API, donc
            # pas par sa vérification de session.
            auth_request /_session;
            proxy_pass http://127.0.0.1:8091;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache media;
            proxy_cache_key $request_uri;
            # Deux demandes simultanées de la même planche : une seule part à l'API.
            proxy_cache_lock on;
            proxy_cache_bypass $media_uncacheable;
            proxy_no_cache $media_uncacheable;
            add_header X-Cache $upstream_cache_status always;
            proxy_read_timeout 300s;
        }

        # API HTTP : scan, lecture, couvertures, envoi de livres.
        location /api/ {
            proxy_pass http://127.0.0.1:8091;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Hôte **avec** son port : l'API en déduit l'adresse de retour OIDC.
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Un dossier entier déposé peut demander plusieurs minutes ; la
            # couverture d'un gros PDF prend aussi son temps.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # WebSocket du catalogue : la connexion reste ouverte, donc pas de
        # délai de lecture court.
        location /ws {
            proxy_pass http://127.0.0.1:8091;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # Interface : rendu SvelteKit (SSR).
        location / {
            proxy_pass http://127.0.0.1:3100;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
