# En-têtes de sécurité, inclus dans `server` **et** dans chaque `location` qui
# pose un `add_header` : nginx n'hérite pas des en-têtes d'un niveau supérieur
# dès qu'un niveau inférieur en déclare un.
#
# `frame-ancestors` / `X-Frame-Options` : aucune page n'est jamais embarquée (pas
# de clickjacking sur le formulaire de connexion). Pas de CSP complète : le rendu
# des EPUB (HTML et CSS de tiers) et pdf.js en demanderaient une très large.
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
