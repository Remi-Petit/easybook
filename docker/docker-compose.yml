# easybook — **déploiement de production** (image publiée sur GHCR).
#
#   cp docker/.env.example docker/.env     # puis renseigner les valeurs
#   docker compose -f docker/docker-compose.yml up -d
#   → interface + API : http://<hôte>:${EASYBOOK_PORT:-5100}
#
# Tous les réglages viennent du `.env` **de ce dossier** (`docker/.env`, chargé
# automatiquement par Compose) ; le `.env` de développement de la racine n'est
# pas lu. Sans `.env`, les valeurs par défaut ci-dessous suffisent — mais
# l'administrateur reçoit alors un mot de passe tiré au hasard, affiché une
# seule fois dans `docker logs easybook`.

services:
  easybook:
    image: ghcr.io/remi-petit/easybook:latest
    container_name: easybook
    restart: unless-stopped
    ports:
      # Un seul port : nginx sert l'interface **et** relaie l'API (`/api`, `/ws`).
      # L'API n'écoute que dans le conteneur ; l'interface exige une connexion.
      - "${EASYBOOK_PORT:-5100}:8080"
    environment:
      # Administrateur créé au premier démarrage (base de comptes vide).
      EASYBOOK_ADMIN_EMAIL: ${EASYBOOK_ADMIN_EMAIL}
      # Vide : mot de passe tiré au hasard, affiché **une seule fois** dans les journaux (à changer dès la première connexion).
      EASYBOOK_ADMIN_PASSWORD: ${EASYBOOK_ADMIN_PASSWORD:-}
      # Configuration OIDC (facultative) : si l'un de ces champs est vide, le SSO est désactivé.
      EASYBOOK_OIDC_ISSUER: ${EASYBOOK_OIDC_ISSUER:-}
      EASYBOOK_OIDC_DISCOVERY_URL: ${EASYBOOK_OIDC_DISCOVERY_URL:-}
      EASYBOOK_OIDC_CLIENT_ID: ${EASYBOOK_OIDC_CLIENT_ID:-}
      EASYBOOK_OIDC_CLIENT_SECRET: ${EASYBOOK_OIDC_CLIENT_SECRET:-}
      EASYBOOK_OIDC_REDIRECT_URL: ${EASYBOOK_OIDC_REDIRECT_URL:-}
      EASYBOOK_OIDC_LABEL: ${EASYBOOK_OIDC_LABEL:-Single sign-on}
      # True : création automatique d'un compte Easybook pour un utilisateur OIDC inconnu (sinon, il faut créer le compte manuellement dans l'interface).
      EASYBOOK_OIDC_AUTO_CREATE: ${EASYBOOK_OIDC_AUTO_CREATE:-true}
      # True : lier automatiquement un compte Easybook existant à un utilisateur OIDC inconnu (sinon, il faut lier le compte manuellement dans l'interface).
      EASYBOOK_OIDC_LINK_BY_EMAIL: ${EASYBOOK_OIDC_LINK_BY_EMAIL:-true}
      # Autonomie : `true` autorise chaque personne connectée à lier elle-même
      # son compte à une identité du fournisseur (page Mon compte). Sinon, seuls
      # les administrateurs peuvent le faire (page Comptes).
      EASYBOOK_OIDC_SELF_LINK: ${EASYBOOK_OIDC_SELF_LINK:-false}
    volumes:
      # Le conteneur tourne sous l'utilisateur `node` (uid 1000) : sous Linux, ce
      # dossier doit lui appartenir (`chown -R 1000:1000 books`) pour que le
      # dépôt de livres fonctionne.
      - ${EASYBOOK_BOOKS:-./books}:/books
      # Les comptes (SQLite) : à garder entre deux conteneurs. Au premier démarrage,
      # le mot de passe de l'administrateur est affiché dans `docker logs easybook`
      # (ou imposé par `EASYBOOK_ADMIN_PASSWORD`).
      - easybook-data:/data

volumes:
  easybook-data:
