# easybook — **un** conteneur, **un** port.
#
#   docker compose up --build
#   → interface + API : http://localhost:5100
#
# L'image (`Dockerfile`, racine) contient les trois pièces : nginx, l'interface
# SvelteKit et l'API Rust. nginx est le seul point d'entrée ; il sert les
# fichiers compilés du frontend, relaie `/api` et `/ws` vers l'API, et le reste
# vers le serveur SvelteKit.
#
# Ce fichier est celui du **développement** : il construit l'image depuis les
# sources. Pour un déploiement, partir de `docker/docker-compose.yml` (image
# publiée sur GHCR, rien à compiler).

services:
  easybook:
    build:
      context: .
      dockerfile: Dockerfile
    image: easybook:dev
    # Compose construit et ne cherche jamais `easybook:dev` sur un registre.
    pull_policy: build
    container_name: easybook
    restart: unless-stopped
    ports:
      # Seul port publié : nginx. L'API et le serveur SvelteKit écoutent sur la
      # boucle locale du conteneur et ne sont pas joignables de l'extérieur
      # (l'API n'a pas d'authentification).
      - "5200:8080"
    volumes:
      # La bibliothèque : lue **et écrite** (création de catégories, dépôt de
      # livres depuis l'interface).
      #
      # Sous Docker Desktop (Windows/macOS), le système de fichiers de l'hôte ne
      # remonte aucun événement inotify : l'interface ne se rafraîchit alors pas
      # toute seule quand un livre est ajouté **depuis l'hôte** (les ajouts faits
      # dans l'interface, eux, sont diffusés directement).
      - ./books:/books
