# easybook — **un** conteneur, **un** port.
#
#   docker compose up --build
#   → interface + API : http://localhost:5200
#
# L'image (`Dockerfile`, racine) contient les trois pièces : nginx, l'interface
# SvelteKit et l'API Rust. nginx est le seul point d'entrée ; il sert les
# fichiers compilés du frontend, relaie `/api` et `/ws` vers l'API, et le reste
# vers le serveur SvelteKit.
#
# Ce fichier est celui du **développement** : le backend est compilé en profil
# `dev` (incrémental, binaire non optimisé) — la première construction compile
# les dépendances, les suivantes ne recompilent que ce qui a changé. Pour tester
# l'image de production (compilation `release`, longue), voir
# `docker-compose.release.yml`. Pour un déploiement, partir de
# `docker/docker-compose.yml` (image publiée sur GHCR, rien à compiler).

services:
  easybook:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_PROFILE: dev
    image: easybook:dev
    # Compose construit et ne cherche jamais `easybook:dev` sur un registre.
    pull_policy: build
    container_name: easybook
    restart: unless-stopped
    ports:
      # Seul port publié : nginx. L'API et le serveur SvelteKit écoutent sur la
      # boucle locale du conteneur et ne sont pas joignables de l'extérieur.
      - "5200:8080"
    volumes:
      # La bibliothèque : lue **et écrite** (création de catégories, dépôt de
      # livres depuis l'interface).
      #
      # Sous Docker Desktop (Windows/macOS), le système de fichiers de l'hôte ne
      # remonte aucun événement inotify : l'interface ne se rafraîchit alors pas
      # toute seule quand un livre est ajouté **depuis l'hôte** (les ajouts faits
      # dans l'interface, eux, sont diffusés directement).
      - ./books:/books
      # Les comptes (SQLite) : à garder entre deux conteneurs, sinon les
      # utilisateurs et les liaisons OIDC disparaissent avec lui.
      - easybook-data:/data
    environment:
      # Administrateur créé au premier démarrage (base vide). Mot de passe de
      # **test** : en production, le laisser vide en tirerait un au hasard,
      # affiché une fois dans les journaux (`docker logs easybook`).
      EASYBOOK_ADMIN_USER: admin
      EASYBOOK_ADMIN_PASSWORD: ${EASYBOOK_ADMIN_PASSWORD:-admin-dev-1234}
      # Connexion par Keycloak (conteneur `keycloak`, plus bas). L'émetteur est
      # l'adresse que voit le **navigateur** ; easybook, lui, lit la découverte
      # par le réseau de Compose.
      EASYBOOK_OIDC_ISSUER: http://localhost:8180/realms/easybook
      EASYBOOK_OIDC_DISCOVERY_URL: http://keycloak:8080/realms/easybook
      EASYBOOK_OIDC_CLIENT_ID: easybook
      EASYBOOK_OIDC_CLIENT_SECRET: easybook-test-secret
      EASYBOOK_OIDC_LABEL: Keycloak
      # Un compte Keycloak inconnu est refusé tant qu'un administrateur ne l'a pas
      # lié à un compte (page Administration > Comptes). Mettre `true` pour
      # créer les comptes à la volée.
      EASYBOOK_OIDC_AUTO_CREATE: "false"
      EASYBOOK_OIDC_LINK_BY_EMAIL: "false"
      EASYBOOK_OIDC_SELF_LINK: "false"
    depends_on:
      keycloak:
        condition: service_healthy

  # Fournisseur OpenID Connect **réservé aux tests** : un realm `easybook` est
  # importé au démarrage (`docker/keycloak/easybook-realm.json`) avec trois
  # utilisateurs — alice, bob (e-mail vérifié) et carol (e-mail non vérifié) —
  # dont le mot de passe est le nom. Console d'administration : http://localhost:8180
  # (admin / admin). Ne jamais l'exposer : mots de passe publics, mode `start-dev`.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: easybook-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Adresse publique (celle du navigateur, donc l'`iss` des jetons)…
      KC_HOSTNAME: http://localhost:8180
      # …tandis que les points d'accès serveur à serveur (jeton, clés) restent
      # joignables par le nom du conteneur.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./docker/keycloak/easybook-realm.json:/opt/keycloak/data/import/easybook-realm.json:ro
    healthcheck:
      # L'image n'a ni curl ni wget : on ouvre la socket du port de gestion à la main.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

volumes:
  easybook-data:
