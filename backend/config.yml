# easybook — configuration de l'application
#
# Relu à chaque démarrage. `BOOKS_ROOT` (variable d'environnement) gagne sur ce
# fichier : c'est ce que le conteneur Docker utilise (`/books`).

# Dossier des livres. Relatif au dossier de CE fichier (`backend/`).
books_root: ../books

# Plafonds de ressources. Une clé absente garde sa valeur par défaut.
limits:
  # Lectures de livre simultanées (page, ressource, chapitre, fiche). Au-delà,
  # les requêtes attendent leur tour. Mesuré : 16 est trop bas (latence p95 de
  # 16 à 172 ms sous 400 req/s de pages, contre 12 à 26 ms à 64 ou sans plafond).
  max_concurrent_reads: 64
  # Threads bloquants du runtime (Tokio en autorise 512 par défaut) : au moins
  # `max_concurrent_reads`, pour laisser de la place aux couvertures et au scan.
  max_blocking_threads: 128
  # Archives ZIP (CBZ, EPUB) gardées ouvertes entre deux requêtes : évite de
  # relire l'annuaire de l'archive à chaque page. 0 pour désactiver.
  open_archives: 16
  # Comptages de pages gardés en mémoire (et sur disque). À garder au moins égal
  # au nombre de livres : au-delà, chaque scan rouvre les livres en trop.
  page_counts: 50000

# Historique de la page Performances. Le serveur enregistre une mesure toutes
# les `sample_secs` et la conserve `retention_days` jours (30 au maximum) ; la
# page se rafraîchit toutes les `live_secs` (0.5 = 2 mesures par seconde, soit
# 2 FPS). `enabled: false` désactive l'enregistrement (la page reste utilisable
# en direct).
performance:
  enabled: true
  sample_secs: 10
  retention_days: 30
  live_secs: 0.5

# Comptes et connexion (voir le README, « Comptes et connexion »).
auth:
  # false : aucune connexion, l'API est ouverte à qui l'atteint.
  enabled: true
  # Durée d'une session, en jours.
  session_days: 30
  # OpenID Connect : actif dès que `issuer` et `client_id` sont renseignés. Chaque
  # clé se pose aussi par variable (`EASYBOOK_OIDC_ISSUER`, `_CLIENT_ID`,
  # `_CLIENT_SECRET`, `_DISCOVERY_URL`, `_REDIRECT_URL`, `_LABEL`, `_AUTO_CREATE`,
  # `_LINK_BY_EMAIL`, `_SELF_LINK`), qui gagne sur ce fichier.
  oidc:
    issuer: ""
    client_id: ""
  # Connexion par passkey (WebAuthn). Facultative : chaque personne ajoute une
  # passkey à son compte depuis « Mon compte » ; le mot de passe et le SSO
  # restent disponibles. `rp_id` doit être le domaine **définitif** du site (une
  # passkey y est liée pour toujours) ; vide, il est déduit de l'adresse de la
  # requête. `origin` est l'adresse complète attendue (HTTPS, ou localhost).
  # Chaque clé se pose aussi par variable (`EASYBOOK_WEBAUTHN_ENABLED`,
  # `_RP_ID`, `_RP_NAME`, `_ORIGIN`).
  webauthn:
    enabled: true
    rp_id: ""
    rp_name: easybook
    origin: ""
