[package]
name = "easybook"
version = "0.3.4"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
description = "Bibliothèque de livres (EPUB, CBZ, PDF) surveillée en temps réel"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dotenvy = "0.15"
futures-util = "0.3"
# Le dossier `books/` est surveillé, jamais sondé : un événement, une diffusion.
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
# EPUB et CBZ sont des archives ZIP : une seule dépendance les ouvre toutes les
# deux (`archive`). Version 9 : les 2.x portent plusieurs avis RustSec.
zip = "9"
roxmltree = "0.20"
regex = "1.13.1"
# CORS : l'interface est servie sur une autre origine que l'API (deux process,
# deux ports) et lui parle en direct — sans relais.
tower-http = { version = "0.6", features = ["cors", "fs"] }
# `ServiceExt::oneshot` : appeler `ServeFile` depuis un handler axum.
tower = { version = "0.5", features = ["util"] }
# Vignettes de couverture : décodage des images d'un livre et ré-encodage en
# JPEG. On ne garde que les formats qu'on trouve réellement dans une bande
# dessinée (une planche scannée est presque toujours en JPEG).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Encodage JPEG des vignettes : l'encodeur de `image` dominait le CPU du
# préchauffage des couvertures.
jpeg-encoder = { version = "0.7", features = ["simd"] }
# Réduction des planches (SIMD) : `imageops::resize` de `image` dominait le CPU.
fast_image_resize = "6"
# PDF : extraction de l'image de la première page (couverture). `lopdf` est du
# Rust pur : la mise en page n'est pas rendue, mais un scan ou une planche est
# une image embarquée, et c'est de celle-là qu'on tire la vignette.
lopdf = "0.47"
# Les flux d'un PDF passent souvent par `FlateDecode` avant le JPEG : on défait
# nous-mêmes la compression (lopdf s'arrête sur `DCTDecode`, qui n'est pas une
# compression de pixels à ses yeux). Déjà présent via `zip` et `lopdf`.
flate2 = "1"
# CBR : archive RAR. Le crate embarque les sources C++ d'unrar et les compile
# (voir backend/Dockerfile : `g++`/`make` requis à la construction).
unrar = "0.5"
hayro = "0.9"
# PDF : compter les pages sans lire le fichier en entier (voir `formats::pdf`).
memmap2 = "0.9"
jpeg-decoder = { version = "0.3", default-features = false }

# Rendre à l'OS la mémoire libérée après le décodage d'une image (`malloc_trim`).
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Tests PDF : fabriquer un flux `LZWDecode` (même version que `lopdf`).
weezl = "0.2"
# Tests d'intégration : monter le routeur et l'appeler sans ouvrir de socket.
http-body-util = "0.1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
# Décodage d'images et rendu PDF : ~45x plus lents sans optimisation (une
# couverture de CBZ passe de 3,5 s à 80 ms). Seules les dépendances sont
# optimisées, le code d'easybook reste rapide à recompiler.
opt-level = 3
# Sans assertions de debug ni contrôles de dépassement : ils ralentissaient encore
# le décodage, l'encodage et la réduction des images de plusieurs fois (mesuré).
debug-assertions = false
overflow-checks = false

# Les API génériques des dépendances (`fast_image_resize`, `image`) sont compilées
# dans CE crate : à opt-level 0, réduire une planche de 1200x1884 prend ~340 ms
# (8 ms à 2). La recompilation d'easybook reste de l'ordre de 5 s (mesuré).
[profile.dev.package.easybook]
opt-level = 2
